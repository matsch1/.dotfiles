# Reload tmux configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Set prefix key to Ctrl+s
set -g prefix C-s

# Enable mouse support
set -g mouse on

# Use vi key bindings in copy mode
setw -g mode-keys vi

# Pane navigation bindings
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Scroll bindings in copy mode
bind -T copy-mode-vi k send-keys -X scroll-up
bind -T copy-mode-vi j send-keys -X scroll-down

# vim-tmux-navigator compatibility
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^(vim|nvim)$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Status line settings
set-option -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Plugins configuration
set -g @plugin 'tmux-plugins/tpm'                  # Tmux Plugin Manager
set -g @plugin 'catppuccin/tmux#v2.1.0'            # Catppuccin theme plugin
set -g @plugin 'christoomey/vim-tmux-navigator'    # vim-tmux-navigator plugin

# Catppuccin theme settings
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load Catppuccin theme
run '~/.tmux/plugins/catppuccin.tmux'

# Initialize Tmux Plugin Manager (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'

